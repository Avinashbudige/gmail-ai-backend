server:
  port: 8080

spring:
  application:
    name: core-service
  datasource:
    url: jdbc:h2:mem:gmaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

gmail:
  mode: mock

# Email processing configuration
email:
  processing:
    thread-pool-size: 10
    rate-limit-requests-per-minute: 30

# Token cache configuration
token:
  cache:
    max-size: 1000
    expiration-minutes: 55

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driverClassName: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update